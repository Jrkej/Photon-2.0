[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "photon"
version = "0.1.0"
description = "PHOTON: live photo sync between the galleries of a session's members"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "redis>=5.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "protobuf>=5.27",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "httpx>=0.27",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "google-crc32c>=1.5",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
push = ["firebase-admin>=6.5", "aioapns>=3.2"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "pgserver>=0.1.4",
  "grpcio-tools>=1.66",
  "websockets>=13",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
photon-cli = "photon.client.cli:main"
photon-dev = "photon.dev.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photon = ["orchestrator/lua/*.lua", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["slow: long-running concurrency or model-based tests", "bench: benchmarks (scripts/bench.sh)"]
addopts = "-m 'not bench'"
filterwarnings = ["ignore::DeprecationWarning:pgserver.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/photon/common/pb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP047", "ASYNC109", "ASYNC230", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["src/photon/common/pb/"]
[[tool.mypy.overrides]]
module = ["photon.common.pb.*", "google.*", "google_crc32c", "pillow_heif", "pgserver", "firebase_admin.*", "aioapns.*"]
ignore_missing_imports = true
ignore_errors = true
