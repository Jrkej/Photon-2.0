global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: auth
    dns_sd_configs: [{names: [auth], type: A, port: 8082}]
  - job_name: orchestrator
    dns_sd_configs: [{names: [orchestrator], type: A, port: 8080}]
  - job_name: imageserver
    static_configs: [{targets: ["imageserver:8081"]}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
