# Redis for PHOTON: one primary with one asynchronous replica, no Cluster (session keys already carry {sid} tags).
# Durability: AOF with fsync every second. A crash or failover can lose about the last second of acknowledged
# writes; the recovery rules are in Design.md "What losing recent Redis state means".
port 0
tls-port 6379
tls-cert-file /certs/redis.pem
tls-key-file /certs/redis.key
tls-ca-cert-file /certs/ca.pem
tls-auth-clients no
tls-replication yes
aclfile /etc/redis/users.acl
protected-mode yes
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
maxmemory-policy noeviction
latency-tracking yes
