// PHOTON wire format. Rules: never reuse or renumber a field; add new fields only.
// Every HTTP body is application/x-protobuf; WebSocket frames are binary protobuf.
syntax = "proto3";

package photon.v1;

option java_package = "com.photon.proto";
option java_multiple_files = true;
option swift_prefix = "Pb";

// ---------------------------------------------------------------- design messages

message AnnounceRequest {
  bytes  sha256       = 1;
  uint64 size         = 2;
  string mime         = 3;
  int64  taken_at_ms  = 4;
  string session_id   = 5;   // added by the implementation plan
  bytes  photo_tag    = 6;   // E2EE: HMAC-SHA256(tag key, ...) of the original photo, for session-wide dedupe (e2ee.md)
  uint32 key_epoch    = 7;   // E2EE: the epoch whose key encrypted the file; must be the session's current epoch
}

message AnnounceResponse {
  enum Result { UPLOAD = 0; ALREADY_UPLOADED = 1; IN_PROGRESS = 2; }
  Result result          = 1;
  string upload_id       = 2;
  string upload_url      = 3;
  string upload_token    = 4;
  uint32 chunk_size_hint = 5;
}

message PhotoStored {          // image server -> orchestrator
  string session_id    = 1;
  bytes  sha256        = 2;
  string upload_id     = 3;
  string uploader_id   = 4;
  uint64 size          = 5;
  string mime          = 6;
  int64  taken_at_ms   = 7;
  int64  stored_at_ms  = 8;
  int64  expires_at_ms = 9;   // set by the image server
}

message PhotoRejected {        // image server -> orchestrator
  string session_id = 1;
  bytes  sha256     = 2;
  string upload_id  = 3;
  string reason     = 4;      // HASH_MISMATCH, INVALID_IMAGE
}

message PhotoEvent {           // orchestrator -> members
  enum Type { PHOTO_STORED = 0; PHOTO_RECALLED = 1; MEMBER_JOINED = 2;
              MEMBER_LEFT = 3; SESSION_ENDED = 4;
              HOST_CHANGED = 5;    // added: member_id is the new host
              KEY_SHARED = 6;      // E2EE: a sealed key for member_id and key_epoch is waiting
              KEY_ROTATED = 7; }   // E2EE: member_id started epoch key_epoch; fetch your sealed key
  string event_id      = 1;    // Redis stream id, increasing per session
  Type   type          = 2;
  string session_id    = 3;
  bytes  sha256        = 4;
  string uploader_id   = 5;
  uint64 size          = 6;
  int64  taken_at_ms   = 7;
  int64  expires_at_ms = 8;
  string member_id     = 9;
  bytes  member_key    = 10;   // E2EE, MEMBER_JOINED: the member's X25519 public key (32 bytes)
  uint32 key_epoch     = 11;   // E2EE: PHOTO_STORED, the file's epoch; KEY_SHARED and KEY_ROTATED, the epoch
  bytes  photo_tag     = 12;   // E2EE, PHOTO_STORED: the uploader's photo tag (receivers check it)
}

message Snapshot {
  string cursor                    = 1;  // continue the stream after this id
  repeated PhotoEvent live_photos  = 2;  // STORED and not yet expired
  repeated bytes recalled_sha256   = 3;
  repeated string member_ids       = 4;
  uint32 key_epoch                 = 5;  // E2EE: the session's current key epoch
}

message Error {
  string code            = 1;
  string message         = 2;
  bool   retryable       = 3;
  uint32 retry_after_s   = 4;
  repeated uint32 missing_chunks = 5;  // added: 400 on complete lists the missing chunk indexes
}

// ---------------------------------------------------------------- auth

message OAuthStartRequest {
  string provider       = 1;   // "google", "dev"
  string redirect_uri   = 2;   // must equal the registered URI exactly
  string code_challenge = 3;   // base64url(sha256(code_verifier)), 43 chars
}

message OAuthStartResponse {
  string authorization_url = 1;
  string state             = 2;
}

message OAuthCallbackRequest {
  string code          = 1;
  string state         = 2;
  string code_verifier = 3;
  string redirect_uri  = 4;
}

message TokenPair {
  string access_token         = 1;
  string refresh_token        = 2;
  int64  access_expires_at_ms = 3;
  string user_id              = 4;
}

message RefreshRequest {
  string refresh_token = 1;
}

message DeviceRegistration {
  string platform   = 1;   // "android" or "ios"
  string push_token = 2;
}

// ---------------------------------------------------------------- sessions

message CreateSessionRequest {
  uint32 max_members = 1;   // 0 means the default
  bytes  member_key  = 2;   // E2EE: the creator's X25519 public key (32 bytes); required
}

message SessionInfo {
  string session_id    = 1;
  string join_code     = 2;
  string invite_url    = 3;
  string qr_payload    = 4;
  int64  expires_at_ms = 5;
  string role          = 6;   // "host" or "member"
  repeated string member_ids = 7;
  string host_id       = 8;
}

message JoinRequest {
  oneof by {
    string code         = 1;
    string invite_token = 2;
  }
  bytes member_key = 3;     // E2EE: the joiner's X25519 public key (32 bytes); required
}

message SessionRef {
  string session_id = 1;
}

message KickRequest {
  string session_id = 1;
  string member_id  = 2;
}

message ReportPhotoRequest {
  string reason = 1;
}

// ---------------------------------------------------------------- uploads (image server)

message UploadStatus {
  string upload_id               = 1;
  string state                   = 2;   // RECEIVING, VERIFIED, REPORTING, STORED, REJECTED, SUPERSEDED, ENDED
  repeated uint32 received_chunks = 3;
  uint64 received_bytes          = 4;
  bool   server_has_file         = 5;
}

message CompleteRequest {
  uint32 chunk_count = 1;
}

message CompleteResponse {
  string state         = 1;   // STORED
  bytes  sha256        = 2;
  int64  stored_at_ms  = 3;
  int64  expires_at_ms = 4;
}

message ReportAck {            // orchestrator -> image server
  enum Result { APPLIED = 0; NOOP = 1; }
  Result result   = 1;
  string event_id = 2;
}

// ---------------------------------------------------------------- events

message EventBatch {
  repeated PhotoEvent events = 1;
  string cursor              = 2;
}

message Hello {
  string access_token  = 1;
  string session_id    = 2;
  string last_event_id = 3;
}

message ClientFrame {
  oneof f {
    Hello  hello = 1;
    uint64 ping  = 2;
  }
}

message ServerFrame {
  oneof f {
    PhotoEvent event        = 1;
    Error      error        = 2;
    uint64     pong         = 3;
    string     ready_cursor = 4;
  }
}

// ---------------------------------------------------------------- native sign-in (added)

message AuthConfig {            // GET /v1/auth/config: which sign-in methods this server offers
  string google_client_id = 1;  // the server (web) OAuth client id; empty when Google sign-in is off
  bool   dev_login        = 2;  // development only: sign in with a bare username
  bool   github_login     = 3;  // the browser flow with provider "github" is available
}

message NonceResponse {         // POST /v1/auth/nonce: single use, 10 minutes
  string nonce         = 1;
  int64  expires_at_ms = 2;
}

message GoogleSignInRequest {   // POST /v1/auth/google: an ID token from Android Credential Manager / iOS
  string id_token = 1;
  string nonce    = 2;          // the nonce from /v1/auth/nonce, which the ID token must carry
}

message DevLoginRequest {       // POST /v1/auth/dev/login (development only)
  string username = 1;
}

// ---------------------------------------------------------------- end-to-end encryption (added, see e2ee.md)

message MemberKey {
  string member_id  = 1;
  bytes  member_key = 2;   // X25519 public key, 32 bytes
  uint32 key_epoch  = 3;   // the newest epoch this member holds a key for; 0 means none yet
}

message SealedKey {
  string member_id      = 1;   // the recipient
  uint32 epoch          = 2;
  bytes  box            = 3;   // 117 bytes: an epoch key bundle sealed to the recipient's member key
  string from_member_id = 4;   // set by the server
}

message KeyState {             // GET /v1/sessions/{sid}/keys
  uint32 epoch               = 1;   // the current epoch: new photos must be encrypted with its key
  bool   rotation_required   = 2;   // a member left: the next uploader must start epoch + 1 first
  repeated MemberKey members = 3;
  repeated SealedKey sealed  = 4;   // the caller's own sealed keys, for every epoch
}

message KeyUpload {            // POST /v1/sessions/{sid}/keys
  uint32 epoch  = 1;
  bool   rotate = 2;           // true: start epoch (= current + 1), sealed for every other member
  repeated SealedKey keys = 3;
}

message KeyUploadResult {
  uint32 epoch  = 1;   // the current epoch after the call
  uint32 stored = 2;   // boxes stored; a box for a member who already holds that epoch is ignored
}
